name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sala_baza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24.x'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/sala_baza
      run: npm test -- --detectOpenHandles

    - name: Build Docker image
      run: |
        docker build . -t my-app:latest