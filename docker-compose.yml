version: "3.8"

services:
  # Servis za bazu podataka
  db:
    image: postgres:17
    container_name: sala_baza_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sala_baza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sala_baza"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Glavna Node.js aplikacija
  app:
    build: .
    container_name: sala_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sala_baza
      JWT_SECRET: tajna
    depends_on:
      db:
        condition: service_healthy
    # Komanda koja prvo osveži bazu (push), pa pokrene app
    command: >
      sh -c "npx drizzle-kit push && npx tsx src/db/seed.ts && npm start"

volumes:
  postgres_data: